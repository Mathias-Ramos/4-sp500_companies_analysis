version: 2

sources:
  - name: raw
    description: "Raw S&P 500 data scraped with yfinance, loaded into Snowflake from S3."
    schema: STAGING
    tables:

      - name: companies
        description: "One row per S&P 500 constituent (reference table)."
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: name
            description: "Company name."
          - name: sector
            description: "GICS sector."
          - name: industry
            description: "GICS industry."
          - name: country
            description: "Country of the company's headquarters."
          - name: currency
            description: "Reporting currency."

      - name: balance_sheet
        description: "Annual balance sheet items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 60
              period: day
            error_after:
              count: 90
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Fiscal period end date."
          - name: total_debt
            description: "Total debt (USD)."
          - name: cash_and_equivalents
            description: "Cash and cash equivalents (USD)."
          - name: stockholders_equity
            description: "Stockholders' equity (USD)."
          - name: invested_capital
            description: "Invested capital (USD, pre-calculated by yfinance). Used for ROIC."
          - name: net_debt
            description: "Net debt (USD, pre-calculated by yfinance). Used for Net Debt / EBITDA."
          - name: total_assets
            description: "Total assets (USD). Additional financial analysis."
          - name: cash_and_short_term_investments
            description: "Cash and cash equivalents plus short-term investments (USD). Alternative cash measure."

      - name: cashflow
        description: "Annual cash flow items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 90
              period: day
            error_after:
              count: 180
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Fiscal period end date."
          - name: operating_cash_flow
            description: "Operating cash flow (USD)."
          - name: capital_expenditure
            description: "Capital expenditure (USD, negative for outflows)."

      - name: income_stmt
        description: "Annual income statement items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 90
              period: day
            error_after:
              count: 180
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Fiscal period end date."
          - name: revenue
            description: "Total revenue (USD)."
          - name: ebit
            description: "Operating income / EBIT (USD)."
          - name: ebitda
            description: "Earnings before interest, taxes, depreciation and amortization (USD)."
          - name: tax_provision
            description: "Income tax provision (USD)."
          - name: pretax_income
            description: "Pre-tax income (USD)."
          - name: net_income
            description: "Net income (USD)."
          - name: diluted_eps
            description: "Diluted earnings per share (USD)."

      - name: prices_daily
        description: "Daily stock prices."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 14
              period: day
            error_after:
              count: 60
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Trading date."
          - name: rounded_close
            description: "Split- and dividend-adjusted closing price, rounded to 2 decimals (USD)."

      - name: metrics
        description: "Historical valuation measures per company (forward-filled from monthly/quarterly measure dates)."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 14
              period: day
            error_after:
              count: 60
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Valuation measure date."
          - name: market_cap
            description: "Market capitalization (USD)."
          - name: enterprise_value
            description: "Enterprise value (USD)."
          - name: trailing_pe
            description: "Trailing P/E ratio."
          - name: forward_pe
            description: "Forward P/E ratio."
          - name: peg_ratio
            description: "PEG ratio (5 year expected)."
          - name: price_sales
            description: "Price to sales ratio."
          - name: price_book
            description: "Price to book ratio."
          - name: ev_revenue
            description: "Enterprise value to revenue ratio."
          - name: ev_ebitda
            description: "Enterprise value to EBITDA ratio."

      - name: ttm_eps
        description: "Trailing twelve-month earnings per share per company (one row per company and quarter-end date)."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 60
              period: day
            error_after:
              count: 90
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: date
            description: "Quarter-end date for the trailing twelve-month period."
          - name: ttm_eps
            description: "Trailing twelve-month diluted earnings per share (USD)."

      - name: analyst_estimates
        description: "One row per company and future period with analyst EPS estimates, revenue estimates, EPS estimate trend and revisions."
        columns:
          - name: ticker
            description: "Stock market symbol."
          - name: period
            description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
          - name: eps_avg
            description: "Average estimated EPS."
          - name: eps_low
            description: "Lowest estimated EPS."
          - name: eps_high
            description: "Highest estimated EPS."
          - name: eps_year_ago
            description: "Actual EPS one year ago."
          - name: eps_number_of_analysts
            description: "Number of contributing analysts for EPS."
          - name: eps_growth
            description: "Year-over-year EPS growth."
          - name: revenue_avg
            description: "Average estimated revenue (USD)."
          - name: revenue_low
            description: "Lowest estimated revenue (USD)."
          - name: revenue_high
            description: "Highest estimated revenue (USD)."
          - name: revenue_year_ago
            description: "Actual revenue one year ago (USD)."
          - name: revenue_number_of_analysts
            description: "Number of contributing analysts for revenue."
          - name: revenue_growth
            description: "Year-over-year revenue growth."
          - name: trend_current
            description: "Current EPS estimate."
          - name: trend_7_days_ago
            description: "EPS estimate 7 days ago."
          - name: trend_30_days_ago
            description: "EPS estimate 30 days ago."
          - name: trend_60_days_ago
            description: "EPS estimate 60 days ago."
          - name: trend_90_days_ago
            description: "EPS estimate 90 days ago."
          - name: up_last_7_days
            description: "Upward EPS revisions in the last 7 days."
          - name: up_last_30_days
            description: "Upward EPS revisions in the last 30 days."
          - name: down_last_30_days
            description: "Downward EPS revisions in the last 30 days."
          - name: down_last_7_days
            description: "Downward EPS revisions in the last 7 days."
          - name: currency
            description: "Reporting currency."
          - name: methodology
            description: "Estimate methodology (e.g. adjusted, normalized)."
