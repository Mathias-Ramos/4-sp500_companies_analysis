version: 2

models:
  - name: stg_eps_trend
    description: "EPS estimate evolution over trailing 90 days per company and period."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: ticker
      - name: period
        description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
        data_tests:
          - not_null
      - name: current_estimate
        description: "Current estimate."
      - name: days_7_ago
        description: "Estimate 7 days ago."
      - name: days_30_ago
        description: "Estimate 30 days ago."
      - name: days_60_ago
        description: "Estimate 60 days ago."
      - name: days_90_ago
        description: "Estimate 90 days ago."
      - name: currency
        description: "Reporting currency."
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']
      - name: methodology
        description: "Estimate methodology (e.g. adjusted, normalized)."
