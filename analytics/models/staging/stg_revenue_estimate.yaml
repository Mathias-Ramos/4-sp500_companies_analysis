version: 2

models:
  - name: stg_revenue_estimate
    description: "Analyst revenue estimates per company and future period."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: ticker
      - name: period
        description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
        data_tests:
          - not_null
      - name: avg
        description: "Average estimated revenue (USD)."
      - name: low
        description: "Lowest estimated revenue (USD)."
      - name: high
        description: "Highest estimated revenue (USD)."
      - name: number_of_analysts
        description: "Number of contributing analysts."
      - name: year_ago_revenue
        description: "Actual revenue one year ago (USD)."
      - name: growth
        description: "Year-over-year growth."
      - name: currency
        description: "Reporting currency."
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']
