version: 2

models:
  - name: stg_eps_revisions
    description: "Recent EPS revision counts per company and period."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: ticker
      - name: period
        description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
        data_tests:
          - not_null
      - name: up_last_7_days
        description: "Upward revisions in the last 7 days."
      - name: up_last_30_days
        description: "Upward revisions in the last 30 days."
      - name: down_last_30_days
        description: "Downward revisions in the last 30 days."
      - name: down_last_7_days
        description: "Downward revisions in the last 7 days."
      - name: currency
        description: "Reporting currency."
        data_tests:
          - accepted_values:
              arguments:
                values: ['USD']
      - name: methodology
        description: "Estimate methodology (e.g. adjusted, normalized)."
