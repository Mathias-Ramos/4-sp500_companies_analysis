version: 2

models:
  - name: stg_financials
    description: "One row per company with current valuation and profitability metrics."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - unique
          - not_null
      - name: pe
        description: "Trailing P/E ratio."
      - name: forward_pe
        description: "Forward P/E ratio."
      - name: ebitda
        description: "EBITDA (USD)."
      - name: sector
        description: "GICS sector."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: industry
        description: "GICS industry."
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: currency
        description: "Reporting currency."
        data_tests:
          - not_null
      - name: market_cap
        description: "Market capitalization (USD)."
