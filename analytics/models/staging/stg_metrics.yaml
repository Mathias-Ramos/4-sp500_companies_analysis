version: 2

models:
  - name: stg_metrics
    description: "Historical valuation measures per company (one row per measure date)."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: ticker
      - name: date
        description: "Valuation measure date."
        data_tests:
          - not_null
      - name: market_cap
        description: "Market capitalization (USD)."
      - name: enterprise_value
        description: "Enterprise value (USD)."
      - name: trailing_pe
        description: "Trailing P/E ratio."
      - name: forward_pe
        description: "Forward P/E ratio."
      - name: peg_ratio
        description: "PEG ratio (5 year expected)."
      - name: price_sales
        description: "Price to sales ratio."
      - name: price_book
        description: "Price to book ratio."
      - name: ev_revenue
        description: "Enterprise value to revenue ratio."
      - name: ev_ebitda
        description: "Enterprise value to EBITDA ratio."
