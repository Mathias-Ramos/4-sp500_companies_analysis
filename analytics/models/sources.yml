version: 2

sources:
  - name: raw
    description: "Raw S&P 500 data scraped with yfinance, loaded into Snowflake from S3."
    schema: STAGING
    tables:

      - name: companies
        description: "One row per S&P 500 constituent (reference table)."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - unique
              - not_null
          - name: name
            description: "Company name."
            data_tests:
              - not_null
          - name: sector
            description: "GICS sector."
            data_tests:
              - not_null
          - name: industry
            description: "GICS industry."

      - name: balance_sheet
        description: "Annual balance sheet items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 60
              period: day
            error_after:
              count: 90
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: date
            description: "Fiscal period end date."
            data_tests:
              - not_null
          - name: total_debt
            description: "Total debt (USD)."
          - name: cash_and_equivalents
            description: "Cash and cash equivalents (USD)."
          - name: stockholders_equity
            description: "Stockholders' equity (USD)."

      - name: cashflow
        description: "Annual cash flow items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 90
              period: day
            error_after:
              count: 180
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: date
            description: "Fiscal period end date."
            data_tests:
              - not_null
          - name: operating_cash_flow
            description: "Operating cash flow (USD)."
          - name: capital_expenditure
            description: "Capital expenditure (USD, negative for outflows)."

      - name: income_stmt
        description: "Annual income statement items per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 90
              period: day
            error_after:
              count: 180
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: date
            description: "Fiscal period end date."
            data_tests:
              - not_null
          - name: revenue
            description: "Total revenue (USD)."
          - name: ebit
            description: "Operating income / EBIT (USD)."
          - name: ebitda
            description: "Earnings before interest, taxes, depreciation and amortization (USD)."
          - name: tax_provision
            description: "Income tax provision (USD)."
          - name: pretax_income
            description: "Pre-tax income (USD)."
          - name: net_income
            description: "Net income (USD)."
          - name: diluted_eps
            description: "Diluted earnings per share (USD)."

      - name: prices_weekly
        description: "Weekly stock prices per company."
        config:
          loaded_at_field: date::timestamp
          freshness:
            warn_after:
              count: 14
              period: day
            error_after:
              count: 60
              period: day
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: date
            description: "Week start date."
            data_tests:
              - not_null
          - name: adj_close
            description: "Split- and dividend-adjusted closing price (USD)."

      - name: financials
        description: "One row per company with current valuation and profitability metrics."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - unique
              - not_null
          - name: pe
            description: "Trailing P/E ratio."
          - name: forward_pe
            description: "Forward P/E ratio."
          - name: ebitda
            description: "EBITDA (USD)."
          - name: sector
            description: "GICS sector."
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: industry
            description: "GICS industry."
            data_tests:
              - not_null:
                  config:
                    severity: warn
          - name: currency
            description: "Reporting currency."
            data_tests:
              - not_null
          - name: market_cap
            description: "Market capitalization (USD)."

      - name: earnings_estimate
        description: "Analyst EPS estimates per company and future period."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: period
            description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
            data_tests:
              - not_null
          - name: avg
            description: "Average estimated EPS."
          - name: low
            description: "Lowest estimated EPS."
          - name: high
            description: "Highest estimated EPS."
          - name: year_ago_eps
            description: "Actual EPS one year ago."
          - name: number_of_analysts
            description: "Number of contributing analysts."
          - name: growth
            description: "Year-over-year growth."
          - name: currency
            description: "Reporting currency."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['USD']
          - name: methodology
            description: "Estimate methodology (e.g. adjusted, normalized)."

      - name: eps_revisions
        description: "Recent EPS revision counts per company and period."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: period
            description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
            data_tests:
              - not_null
          - name: up_last_7_days
            description: "Upward revisions in the last 7 days."
          - name: up_last_30_days
            description: "Upward revisions in the last 30 days."
          - name: down_last_30_days
            description: "Downward revisions in the last 30 days."
          - name: down_last_7_days
            description: "Downward revisions in the last 7 days."
          - name: currency
            description: "Reporting currency."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['USD']
          - name: methodology
            description: "Estimate methodology (e.g. adjusted, normalized)."

      - name: eps_trend
        description: "EPS estimate evolution over trailing 90 days per company and period."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: period
            description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
            data_tests:
              - not_null
          - name: current
            description: "Current estimate."
          - name: days_7_ago
            description: "Estimate 7 days ago."
          - name: days_30_ago
            description: "Estimate 30 days ago."
          - name: days_60_ago
            description: "Estimate 60 days ago."
          - name: days_90_ago
            description: "Estimate 90 days ago."
          - name: currency
            description: "Reporting currency."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['USD']
          - name: methodology
            description: "Estimate methodology (e.g. adjusted, normalized)."

      - name: revenue_estimate
        description: "Analyst revenue estimates per company and future period."
        columns:
          - name: ticker
            description: "Stock market symbol."
            data_tests:
              - not_null
              - relationships:
                  arguments:
                    to: source('raw', 'companies')
                    field: ticker
          - name: period
            description: "Future fiscal period code (e.g. 0q, +1q, 0y)."
            data_tests:
              - not_null
          - name: avg
            description: "Average estimated revenue (USD)."
          - name: low
            description: "Lowest estimated revenue (USD)."
          - name: high
            description: "Highest estimated revenue (USD)."
          - name: number_of_analysts
            description: "Number of contributing analysts."
          - name: year_ago_revenue
            description: "Actual revenue one year ago (USD)."
          - name: growth
            description: "Year-over-year growth."
          - name: currency
            description: "Reporting currency."
            data_tests:
              - accepted_values:
                  arguments:
                    values: ['USD']
