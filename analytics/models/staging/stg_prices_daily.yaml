version: 2

models:
  - name: stg_prices_daily
    description: "Daily stock prices."
    columns:
      - name: ticker
        description: "Stock market symbol."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: ticker
      - name: date
        description: "Trading date."
        data_tests:
          - not_null
      - name: price
        description: "Split- and dividend-adjusted closing price, rounded to 2 decimals (USD)."
